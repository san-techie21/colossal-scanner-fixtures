services:
  agent:
    build:
      context: .
      dockerfile: docker/Containerfile
    privileged: true
    network_mode: host
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AGENT_SIGNING_KEY: 9fK2mQ7xL4pZ8wR1
  db:
    image: postgres:16.4
    ports:
      - "5432:5432"
