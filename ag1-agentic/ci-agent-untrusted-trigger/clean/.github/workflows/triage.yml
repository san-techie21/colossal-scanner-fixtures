# Colossal scanner fixture (inert): an agent triage workflow. Nested under a sample folder, so GitHub never runs it.
name: triage
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: read
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: Triage the issue that started this run and label it.
